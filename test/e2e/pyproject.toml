# Authoritative, fully pinned dependency manifest for the IAM controller e2e tests.
# Versions verified by a successful e2e run against AWS. requirements.txt remains the
# install entrypoint used by the ACK test-infra pytest image; keep the acktest
# reference in both files identical.
# setuptools is required on Python >= 3.12: acktest imports distutils, which
# setuptools provides as a shim.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-controller-e2e"
version = "0.0.0"
description = "Pinned dependencies for the ACK IAM controller e2e tests"
requires-python = ">=3.10"
dependencies = [
    "acktest @ git+https://github.com/aws-controllers-k8s/test-infra.git@ee58accba9ff98b647f99d1a4c071a08ecbf748f",
    "boto3==1.43.56",
    "botocore==1.43.123",
    "certifi==2026.10.23",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "cryptography==50.0.2",
    "execnet==2.1.2",
    "google-auth==2.62.0",
    "idna==3.20",
    "iniconfig==2.3.1",
    "jmespath==1.1.0",
    "kubernetes==28.1.0",
    "oauthlib==4.0.1",
    "packaging==26.3",
    "pluggy==1.7.0",
    "pyasn1==0.6.5",
    "pyasn1_modules==0.4.2",
    "pycparser==3.12",
    "Pygments==2.21.0",
    "pytest==9.2.0",
    "pytest-xdist==3.5.0",
    "python-dateutil==2.9.0.post0",
    "PyYAML==6.0.1",
    "requests==2.34.2",
    "requests-oauthlib==2.0.0",
    "s3transfer==0.19.3",
    "setuptools==84.2.1",
    "six==1.17.0",
    "urllib3==1.26.20",
    "websocket-client==1.9.2",
]

# Dependency-only project: do not package the flat-layout test modules.
[tool.setuptools]
packages = []
py-modules = []
